<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopeApp - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>ShopApp</h1>
        <h2>Dashboard</h2>
        <p>Welcome to ShopApp!</p>

        <h2>Products</h2>
        <div class="product-list">
            <div class="product">
                <h3>Laptop</h3>
                <p>Category: Electronics</p>
                <p>Rs. 60,000</p>
                <button>Add to Cart</button>
            </div>

            <div class="product">
                <h3>Headphones</h3>
                <p>Category: Electronics</p>
                <p>Rs. 3,000</p>
                <button>Add to Cart</button>
            </div>

            <div class="product">
                <h3>T-Shirt</h3>
                <p>Category: Clothing</p>
                <p>Rs. 1,000</p>
                <button>Add to Cart</button>
            </div>

            <div class="product">
                <h3>Shoes</h3>
                <p>Category: Footwear</p>
                <p>Rs. 2,500</p>
                <button>Add to Cart</button>
            </div>
        </div>

        <button id = "logout-button">Logout</button>
    </main>
    <script src="app.js"></script>    
</body>
</html>
