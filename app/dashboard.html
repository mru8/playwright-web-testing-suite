<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopeApp - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>ShopApp</h1>
        <h2>Dashboard</h2>
        <p>Welcome to ShopApp!</p>

        <div class="search-section">
            <input type="text" id="search-input" placeholder="Search products">
            <button id="search-button">Search</button>
        </div>
        
        <div class="filter-section">
            <label for="category-filter">Filter by category:</label>
            <select id="category-filter">
                <option value="all">All</option>
                <option value="Electronics">Electronics</option>
                <option value="Clothing">Clothing</option>
                <option value="Footwear">Footwear</option>
            </select>
        </div>

        <h2>Cart (<span id="cart-count">0</span> <span id="cart-item-label">items</span>)</h2>
        <div id="cart-items"></div>
        <div id="cart-total"></div>
        
        <h2>Products</h2>
        <div class="product-list">
            <div class="product" data-name="laptop" data-category="Electronics" data-price="60000">
                <h3>Laptop</h3>
                <p>Category: Electronics</p>
                <p>Rs. 60,000</p>
                <button>Add to Cart</button>
            </div>

            <div class="product" data-name="headphones" data-category="Electronics" data-price="3000">
                <h3>Headphones</h3>
                <p>Category: Electronics</p>
                <p>Rs. 3,000</p>
                <button>Add to Cart</button>
            </div>

            <div class="product" data-name="t-shirt" data-category="Clothing" data-price="1000">
                <h3>T-Shirt</h3>
                <p>Category: Clothing</p>
                <p>Rs. 1,000</p>
                <button>Add to Cart</button>
            </div>

            <div class="product" data-name="shoes" data-category="Footwear" data-price="2500">
                <h3>Shoes</h3>
                <p>Category: Footwear</p>
                <p>Rs. 2,500</p>
                <button>Add to Cart</button>
            </div>
        </div>

        <button id = "logout-button">Logout</button>
    </main>
    <script src="app.js"></script>    
</body>
</html>
